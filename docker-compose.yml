services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: learning
    ports:
      - "5433:5432"   # 5433 to avoid clashing with graphql-base on 5432
    volumes:
      - learning-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d learning"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  learning-data:
